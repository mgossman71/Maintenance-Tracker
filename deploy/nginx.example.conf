# nginx — Maintenance-Tracker behind nginx (secondary example; Caddy is
# the canonical config in this repo). nginx owns TLS + HSTS (§6.6); the
# app stays on loopback with MT_TRUST_PROXY=1.

server {
    listen 443 ssl http2;
    server_name mt.example.com;

    ssl_certificate     /etc/letsencrypt/live/mt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mt.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS is the proxy's job — the app deliberately never sends it (§6.6)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # uploads are capped at MT_MAX_UPLOAD_MB (default 25) — let a little
    # more through so the app's own 413 envelope is what the browser sees
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name mt.example.com;
    return 301 https://$host$request_uri;
}
