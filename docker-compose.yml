# Local/container run for Maintenance-Tracker (build-plan.md §5, §6.6).
# The app binds loopback on the HOST by default; your TLS-terminating
# reverse proxy (Caddy-led example in M9) points at 127.0.0.1:8787.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: maintenance-tracker:latest
    environment:
      MT_BIND: 0.0.0.0 # container network only; host publish stays loopback
      MT_DATA_DIR: /app/data
      MT_TRUST_PROXY: "1"
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - mt_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          'fetch("http://127.0.0.1:8787/api/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mt_data:
