services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: maintenance-tracker:latest
    container_name: maintenance-tracker
    restart: unless-stopped
    # .env is optional — the image defaults are correct. Copy .env.example
    # to .env only when you need to change something (TZ, MT_DATA_DIR, ...).
    env_file:
      - path: .env
        required: false
    # Published on all interfaces so an external reverse proxy can reach it.
    # The proxy MUST terminate TLS and forward the original Host header, and
    # .env MUST set MT_TRUST_PROXY=1. Firewall this port to the proxy only.
    ports:
      # Exposed on all interfaces for an external reverse proxy (which must
      # provide HTTPS and set MT_TRUST_PROXY=1). Host port overridable via
      # MT_HOST_PORT; container port stays 3000. Restrict access at the
      # firewall/host network so only the proxy can reach this port.
      - "${MT_HOST_PORT:-3000}:3000"
    volumes:
      - mt_v1_data:/data
    networks:
      - default
      # - npm_proxy   # uncomment when using Nginx Proxy Manager
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mt_v1_data:

networks:
  default:
  # npm_proxy:
  #   external: true
